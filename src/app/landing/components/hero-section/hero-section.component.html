<section class="hero" id="inicio" data-section>
  <img
    class="hero__image"
    src="assets/images/hero-la-dosis-1280.jpg"
    srcset="
      assets/images/hero-la-dosis-768.jpg 768w,
      assets/images/hero-la-dosis-1280.jpg 1280w,
      assets/images/hero-la-dosis-1672.jpg 1672w
    "
    sizes="100vw"
    fetchpriority="high"
    alt="Integrantes de La Dosis en su sala de ensayo"
    width="1672"
    height="941"
  />

  <div class="hero__shade" aria-hidden="true"></div>
  <div class="hero__grain" aria-hidden="true"></div>

  <div class="container hero__content reveal">
    <h1 class="hero__title">
      <span class="hero__line">Punk melódico</span>
      <span class="hero__line">para aguantar,</span>
      <span class="hero__line hero__highlight">gritar y seguir.</span>
    </h1>

    <div class="hero__actions">
      <a class="button button--primary" href="#musica">
        <svg class="button__icon" aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path
            d="M7.6 9.6c3.3-1 6.5-.7 9.4.8M8.2 12.4c2.6-.7 5-.5 7.4.7M8.8 15c1.9-.5 3.8-.3 5.6.5"
          />
        </svg>
        Escuchar en Spotify
      </a>

      <a class="button button--ghost" href="#videos">
        <span class="button__play" aria-hidden="true"></span>
        Ver videos
      </a>
    </div>
  </div>

  <img
    class="hero__symbol"
    src="assets/icons/anarchy-symbol.svg"
    alt=""
    aria-hidden="true"
  />
</section>
