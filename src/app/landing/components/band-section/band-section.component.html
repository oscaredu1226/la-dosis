<section class="band section-dark" id="banda" data-section>
  <div class="container band__grid">
    <div class="band__intro reveal">
      <div class="section-title">
        <h2>La banda</h2>
      </div>

      <p>
        La Dosis es una banda peruana de punk rock formada en Lima. Nuestras
        canciones hablan de la realidad que vivimos sin adornos ni mentiras.
        Energía, actitud y letras que incomodan. Ese es nuestro grito.
      </p>
    </div>

    <div
      class="members-carousel reveal"
      aria-label="Carrusel de integrantes de La Dosis"
    >
      <button
        class="carousel-button carousel-button--prev"
        type="button"
        aria-label="Ver integrantes anteriores"
        (click)="scrollMembers(-1)"
      >
        ‹
      </button>

      <div
        #membersTrack
        class="members"
        aria-label="Integrantes de La Dosis"
      >
        @for (member of members; track member.role) {
          <article class="member polaroid reveal">
            <img
              [src]="member.imageUrl"
              [alt]="member.imageAlt"
              width="320"
              height="240"
              loading="lazy"
            />

            <h3>{{ member.name }}</h3>
            <p>{{ member.role }}</p>

            <a
              [href]="member.instagramUrl"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="member.instagramLabel"
            >
              <app-social-icon name="instagram" />
            </a>
          </article>
        }
      </div>

      <button
        class="carousel-button carousel-button--next"
        type="button"
        aria-label="Ver más integrantes"
        (click)="scrollMembers(1)"
      >
        ›
      </button>
    </div>
  </div>
</section>
