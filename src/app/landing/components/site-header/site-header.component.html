<header class="site-header" [class.is-scrolled]="isScrolled()">
  <div class="header__inner">
    <a
      class="brand"
      href="#inicio"
      aria-label="Volver al inicio"
      (click)="navigateTo($event, 'inicio')"
    >
      <img
        src="assets/images/logo-la-dosis.png"
        alt="La Dosis"
        width="420"
        height="240"
      />
    </a>

    <button
      class="menu-toggle"
      type="button"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      aria-controls="menu-principal"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav
      class="main-nav"
      id="menu-principal"
      aria-label="Navegación principal"
      [class.is-open]="menuOpen()"
    >
      @for (item of navItems; track item.fragment) {
        <a
          class="nav-link"
          [class.is-active]="activeFragment() === item.fragment"
          [href]="'#' + item.fragment"
          (click)="navigateTo($event, item.fragment)"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="header-social" aria-label="Redes sociales">
      @for (social of socials; track social.platform) {
        <a
          [href]="social.url"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="social.label"
        >
          <app-social-icon [name]="social.platform" />
        </a>
      }
    </div>
  </div>
</header>

<button
  class="menu-backdrop"
  type="button"
  aria-label="Cerrar menú"
  [hidden]="!menuOpen()"
  (click)="closeMenu()"
></button>
